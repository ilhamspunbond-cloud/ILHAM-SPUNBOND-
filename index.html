<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ILHAM SPUNBOND - Custom App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">

    <!-- MAIN CONTAINER -->
    <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-2xl relative flex flex-col justify-between">
        
        <!-- HEADER DENGAN LOGO KUSTOM ADMIN -->
        <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md sticky top-0 z-50">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center overflow-hidden shadow border border-blue-400">
                    <img id="header-custom-logo" src="" alt="Logo" class="w-full h-full object-cover hidden">
                    <i id="header-default-icon" class="fa-solid fa-bag-shopping text-blue-600 text-xl"></i>
                </div>
                <div>
                    <h1 id="brand-title" class="font-bold text-lg leading-tight">ILHAM SPUNBOND</h1>
                    <p class="text-xs text-blue-100">Custom Tas & Merchandise</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openMyOrders()" class="bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg text-xs font-medium transition">
                    <i class="fa-solid fa-box-archive mr-1"></i> PO Saya
                </button>
                <button onclick="openAdminLogin()" class="text-blue-200 hover:text-white p-2">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </div>
        </header>

        <!-- DYNAMIC CONTENT -->
        <main id="main-content" class="flex-1 p-4 pb-20"></main>

        <!-- AI ASSISTANT BAR -->
        <div class="bg-white border-t border-slate-200 p-3 flex items-center space-x-3 sticky bottom-0 z-40 shadow-lg">
            <div class="w-12 h-12 rounded-full bg-blue-100 border-2 border-blue-500 overflow-hidden flex-shrink-0 relative">
                <img id="ai-avatar-img" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=60" alt="AI" class="w-full h-full object-cover">
                <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 rounded-full border-2 border-white"></div>
            </div>
            <div class="flex-1 cursor-pointer" onclick="openAIChatModal()">
                <p id="ai-name-label" class="text-xs font-bold text-blue-600">Siti (Asisten AI)</p>
                <p class="text-xs text-slate-600 truncate">Halo! Ada yang bisa dibantu untuk pesanan tasnya?</p>
            </div>
            <button onclick="openAIChatModal()" class="bg-blue-600 hover:bg-blue-700 text-white w-10 h-10 rounded-full flex items-center justify-center shadow">
                <i class="fa-solid fa-microphone text-sm"></i>
            </button>
        </div>
    </div>

    <!-- MODAL CUSTOMER DATA -->
    <div id="modal-customer-data" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 shadow-2xl">
            <div class="text-center mb-4">
                <div id="modal-logo-container" class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-2 overflow-hidden shadow">
                    <i class="fa-solid fa-id-card text-2xl"></i>
                </div>
                <h3 class="font-bold text-lg text-slate-800">Selamat Datang di ILHAM SPUNBOND!</h3>
                <p class="text-xs text-slate-500">Silakan isi data diri Anda untuk memulai pesanan.</p>
            </div>
            <form onsubmit="saveCustomerData(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="cust-name" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Nomor WhatsApp / HP</label>
                    <input type="tel" id="cust-phone" required class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="08xxxxxxxxxx">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">Alamat Lengkap Pengiriman</label>
                    <textarea id="cust-address" required rows="2" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Jalan, RT/RW, Kecamatan, Kota..."></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-md">
                    Simpan & Mulai Belanja
                </button>
            </form>
        </div>
    </div>

    <!-- MODAL ADMIN LOGIN (TANPA HINT) -->
    <div id="modal-admin-login" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl w-full max-w-xs p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-slate-800"><i class="fa-solid fa-lock mr-2 text-blue-600"></i>Admin Login</h3>
                <button onclick="closeModal('modal-admin-login')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form onsubmit="verifyAdmin(event)" class="space-y-3">
                <div>
                    <input type="password" id="admin-pass-input" placeholder="Masukkan Kata Sandi" required class="w-full px-3 py-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 rounded-lg text-sm transition">
                    Masuk Panel Admin
                </button>
            </form>
        </div>
    </div>

    <!-- SCRIPT APLIKASI UTAMA -->
    <script>
        const DEFAULT_ADMIN_PASS = "ilhamadmin123"; 
        let appState = {
            customer: JSON.parse(localStorage.getItem('ilham_customer')) || null,
            isAdmin: false,
            settings: JSON.parse(localStorage.getItem('ilham_settings')) || {
                brandName: "ILHAM SPUNBOND",
                appLogo: "" // Logo custom yang di-upload admin
            },
            products: JSON.parse(localStorage.getItem('ilham_products')) || [
                { id: 1, name: 'Tas Spunbond Handle Kotak', category: 'Spunbond', price: 4500, cost: 3000, minQty: 500, colors: ['#ffffff', '#2563eb', '#dc2626', '#16a34a', '#eab308', '#000000'], img: 'https://images.unsplash.com/photo-1597484661642-2436d40742d4?w=400&auto=format&fit=crop&q=60' }
            ],
            orders: JSON.parse(localStorage.getItem('ilham_orders')) || []
        };

        window.onload = function() {
            updateAppLogoUI();
            if (!appState.customer) {
                document.getElementById('modal-customer-data').classList.remove('hidden');
            } else {
                loadCatalogView();
            }
        };

        // Fungsi untuk memperbarui tampilan logo custom admin di seluruh halaman
        function updateAppLogoUI() {
            if (appState.settings.appLogo) {
                const headerLogo = document.getElementById('header-custom-logo');
                const headerIcon = document.getElementById('header-default-icon');
                if(headerLogo && headerIcon) {
                    headerLogo.src = appState.settings.appLogo;
                    headerLogo.classList.remove('hidden');
                    headerIcon.classList.add('hidden');
                }
            }
        }

        function saveCustomerData(e) {
            e.preventDefault();
            const data = {
                name: document.getElementById('cust-name').value,
                phone: document.getElementById('cust-phone').value,
                address: document.getElementById('cust-address').value
            };
            localStorage.setItem('ilham_customer', JSON.stringify(data));
            appState.customer = data;
            document.getElementById('modal-customer-data').classList.add('hidden');
            loadCatalogView();
        }

        function loadCatalogView() {
            const container = document.getElementById('main-content');
            let html = `
                <div class="mb-4 flex justify-between items-center">
                    <div>
                        <h2 class="font-bold text-slate-800 text-lg">Katalog Produk Kustom</h2>
                        <p class="text-xs text-slate-500">Pilih produk, kalkulasi otomatis, & desain logo!</p>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
            `;
            appState.products.forEach(p => {
                html += `
                    <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm flex flex-col justify-between">
                        <div>
                            <div class="h-32 bg-slate-100 relative overflow-hidden flex items-center justify-center">
                                <img src="${p.img}" class="w-full h-full object-contain p-2">
                                <span class="absolute top-2 right-2 bg-blue-600 text-white text-[10px] px-2 py-0.5 rounded-full font-medium">${p.category}</span>
                            </div>
                            <div class="p-3">
                                <h3 class="font-semibold text-xs text-slate-800 line-clamp-1">${p.name}</h3>
                                <p class="text-blue-600 font-bold text-sm mt-1">Rp ${p.price.toLocaleString('id-ID')}</p>
                                <p class="text-[10px] text-slate-400">Min. Order: ${p.minQty} pcs</p>
                            </div>
                        </div>
                        <div class="p-3 pt-0">
                            <button onclick="openDesignStudio(${p.id})" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-2 rounded-lg transition text-center shadow">
                                Mulai Desain
                            </button>
                        </div>
                    </div>
                `;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        let currentDesign = { productId: null, color: '#ffffff', logoUrl: null, posX: 50, posY: 50, size: 80, rotate: 0 };

        function openDesignStudio(productId) {
            const prod = appState.products.find(p => p.id === productId);
            currentDesign.productId = productId;
            currentDesign.color = prod.colors[0];
            currentDesign.logoUrl = null;

            const container = document.getElementById('main-content');
            let colorButtons = '';
            prod.colors.forEach(c => {
                colorButtons += `<button onclick="changeProductColor('${c}')" class="w-7 h-7 rounded-full border-2 border-white shadow-md" style="background-color: ${c}"></button>`;
            });

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <button onclick="loadCatalogView()" class="text-xs text-blue-600 font-semibold"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali</button>
                        <h2 class="font-bold text-sm text-slate-800">Studio & Kalkulator</h2>
                    </div>

                    <!-- PREVIEW BOX DENGAN WATERMARK ILHAM SPUNBOND -->
                    <div id="design-preview-box" class="w-full h-56 rounded-2xl relative overflow-hidden flex items-center justify-center shadow-inner border border-slate-200" style="background-color: ${currentDesign.color};">
                        <img src="${prod.img}" class="max-h-full max-w-full object-contain filter contrast-125 mix-blend-multiply opacity-90" alt="Product">
                        
                        <div id="preview-logo-layer" class="absolute hidden" style="top: 50%; left: 50%; transform: translate(-50%, -50%);">
                            <img id="rendered-logo-img" src="" style="width: 80px; transform: rotate(0deg);" class="object-contain drop-shadow">
                        </div>

                        <div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-20 rotate-[-30deg]">
                            <span class="text-xl font-black text-slate-900 tracking-wider">ILHAM SPUNBOND</span>
                        </div>
                    </div>

                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-3 text-xs">
                        <div>
                            <label class="font-semibold text-slate-700 block mb-1">1. Warna Produk:</label>
                            <div class="flex space-x-2">${colorButtons}</div>
                        </div>

                        <div>
                            <label class="font-semibold text-slate-700 block mb-1">2. Upload Logo Desain:</label>
                            <input type="file" accept="image/*" onchange="handleCustomerLogoUpload(event)" class="w-full text-xs text-slate-500 file:mr-3 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700">
                        </div>

                        <div id="logo-controls" class="space-y-2 pt-2 border-t hidden">
                            <p class="font-bold text-blue-600">Pengaturan Posisi & Sudut Logo:</p>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="text-[10px] text-slate-600">Geser X: <span id="val-x">50%</span></label>
                                    <input type="range" min="10" max="90" value="50" oninput="updateLogoTransform('x', this.value)" class="w-full accent-blue-600">
                                </div>
                                <div>
                                    <label class="text-[10px] text-slate-600">Geser Y: <span id="val-y">50%</span></label>
                                    <input type="range" min="10" max="90" value="50" oninput="updateLogoTransform('y', this.value)" class="w-full accent-blue-600">
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="text-[10px] text-slate-600">Ukuran: <span id="val-size">80px</span></label>
                                    <input type="range" min="30" max="150" value="80" oninput="updateLogoTransform('size', this.value)" class="w-full accent-blue-600">
                                </div>
                                <div>
                                    <label class="text-[10px] text-slate-600">Rotasi: <span id="val-rotate">0°</span></label>
                                    <input type="range" min="-180" max="180" value="0" oninput="updateLogoTransform('rotate', this.value)" class="w-full accent-blue-600">
                                </div>
                            </div>
                        </div>

                        <div class="pt-2 border-t space-y-2">
                            <div class="grid grid-cols-2 gap-2">
                                <div>
                                    <label class="font-semibold text-slate-700 block mb-1">Metode Cetak:</label>
                                    <select id="print-method" class="w-full p-2 border rounded bg-white">
                                        <option value="Sablon">Sablon (Hitam Solid)</option>
                                        <option value="DTF">DTF Full Color</option>
                                        <option value="UV DTF">UV DTF Full Color</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="font-semibold text-slate-700 block mb-1">Jumlah (Min: ${prod.minQty}):</label>
                                    <input type="number" id="order-qty" min="${prod.minQty}" value="${prod.minQty}" oninput="calculateTotal(${prod.price})" class="w-full p-2 border rounded bg-white font-bold text-blue-600">
                                </div>
                            </div>
                            <div class="bg-blue-50 p-3 rounded-lg border border-blue-200 flex justify-between items-center">
                                <span class="font-bold text-slate-800 text-xs">Total Estimasi Biaya:</span>
                                <span id="display-total-price" class="font-black text-blue-600 text-sm">Rp ${(prod.minQty * prod.price).toLocaleString('id-ID')}</span>
                            </div>
                        </div>
                    </div>

                    <button onclick="submitOrder(${prod.id})" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg flex items-center justify-center">
                        <i class="fa-brands fa-whatsapp text-lg mr-2"></i> Kirim PO & Desain ke WhatsApp
                    </button>
                </div>
            `;
        }

        function changeProductColor(hex) {
            currentDesign.color = hex;
            document.getElementById('design-preview-box').style.backgroundColor = hex;
        }

        function handleCustomerLogoUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentDesign.logoUrl = e.target.result;
                    document.getElementById('rendered-logo-img').src = e.target.result;
                    document.getElementById('preview-logo-layer').classList.remove('hidden');
                    document.getElementById('logo-controls').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function updateLogoTransform(type, val) {
            const layer = document.getElementById('preview-logo-layer');
            const img = document.getElementById('rendered-logo-img');
            if (type === 'x') { layer.style.left = val + '%'; document.getElementById('val-x').innerText = val + '%'; }
            if (type === 'y') { layer.style.top = val + '%'; document.getElementById('val-y').innerText = val + '%'; }
            if (type === 'size') { img.style.width = val + 'px'; document.getElementById('val-size').innerText = val + 'px'; }
            if (type === 'rotate') { img.style.transform = `rotate(${val}deg)`; document.getElementById('val-rotate').innerText = val + '°'; }
        }

        function calculateTotal(pricePerItem) {
            const qty = parseInt(document.getElementById('order-qty').value) || 0;
            document.getElementById('display-total-price').innerText = 'Rp ' + (qty * pricePerItem).toLocaleString('id-ID');
        }

        function submitOrder(productId) {
            const prod = appState.products.find(p => p.id === productId);
            const qty = parseInt(document.getElementById('order-qty').value) || prod.minQty;
            const printMethod = document.getElementById('print-method').value;
            const totalPrice = qty * prod.price;

            const newOrder = {
                id: 'PO-' + Date.now().toString().slice(-6),
                date: new Date().toLocaleDateString('id-ID'),
                customer: appState.customer,
                product: prod.name,
                qty: qty,
                totalPrice: totalPrice,
                printMethod: printMethod,
                color: currentDesign.color,
                mockupImg: currentDesign.logoUrl || prod.img,
                status: 'Menunggu Konfirmasi',
                resi: '-',
                paid: false
            };

            appState.orders.unshift(newOrder);
            localStorage.setItem('ilham_orders', JSON.stringify(appState.orders));

            let waText = `Halo Admin *ILHAM SPUNBOND*, saya ingin memesan:%0n%0n`;
            waText += `🆔 No. PO: *${newOrder.id}*%0n`;
            waText += `👤 Nama: ${appState.customer.name}%0n`;
            waText += `📦 Produk: ${prod.name} (${qty} pcs)%0n`;
            waText += `🎨 Metode Cetak: ${printMethod}%0n`;
            waText += `💰 Total Kalkulasi: Rp ${totalPrice.toLocaleString('id-ID')}`;

            window.open(`https://wa.me/6281234567890?text=${waText}`, '_blank');
            openMyOrders();
        }

        // --- ADMIN LOGIN & PANEL ---
        function openAdminLogin() { document.getElementById('modal-admin-login').classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function verifyAdmin(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-pass-input').value;
            if (pass === DEFAULT_ADMIN_PASS) {
                appState.isAdmin = true;
                closeModal('modal-admin-login');
                loadAdminDashboard();
            } else {
                alert('Kata sandi salah!');
            }
        }

        function loadAdminDashboard() {
            const container = document.getElementById('main-content');
            let ordersHtml = '';
            appState.orders.forEach(o => {
                ordersHtml += `
                    <div class="bg-white border rounded-xl p-3 space-y-2 text-xs shadow-sm">
                        <div class="flex justify-between font-bold">
                            <span>${o.id} - ${o.customer.name}</span>
                            <span class="text-blue-600">Rp ${o.totalPrice.toLocaleString('id-ID')}</span>
                        </div>
                        <p class="text-slate-600"><strong>${o.product}</strong> (${o.qty} pcs) | Cetak: ${o.printMethod}</p>
                        <div class="grid grid-cols-2 gap-2 pt-1">
                            <select onchange="updateOrderStatus('${o.id}', this.value)" class="p-1.5 border rounded bg-slate-50">
                                <option ${o.status === 'Menunggu Konfirmasi' ? 'selected' : ''}>Menunggu Konfirmasi</option>
                                <option ${o.status === 'Sedang Diproses' ? 'selected' : ''}>Sedang Diproses</option>
                                <option ${o.status === 'Sedang Dicetak' ? 'selected' : ''}>Sedang Dicetak</option>
                                <option ${o.status === 'Dikirim' ? 'selected' : ''}>Dikirim</option>
                            </select>
                            <input type="text" placeholder="No. Resi Pengiriman" value="${o.resi !== '-' ? o.resi : ''}" onchange="updateOrderResi('${o.id}', this.value)" class="p-1.5 border rounded">
                        </div>
                        <div class="flex justify-end pt-1">
                            <button onclick="markAsPaid('${o.id}')" class="px-3 py-1 rounded font-semibold ${o.paid ? 'bg-green-100 text-green-700' : 'bg-slate-200 text-slate-700'}">${o.paid ? 'Lunas' : 'Tandai Lunas'}</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="flex justify-between items-center bg-slate-800 text-white p-3 rounded-xl">
                        <div>
                            <h2 class="font-bold text-sm">Panel Admin ILHAM SPUNBOND</h2>
                            <p class="text-[10px] text-slate-300">Pengaturan Logo & PO Masuk</p>
                        </div>
                        <button onclick="loadCatalogView()" class="bg-blue-600 px-3 py-1.5 rounded-lg text-xs font-semibold">Tutup</button>
                    </div>

                    <!-- PENGATURAN UPLOAD LOGO UTAMA APLIKASI OLEH ADMIN -->
                    <div class="bg-blue-50 p-3 rounded-xl border border-blue-200 space-y-2 text-xs">
                        <h3 class="font-bold text-blue-800"><i class="fa-solid fa-image mr-1"></i> Upload Logo Utama Aplikasi / Invoice</h3>
                        <p class="text-[11px] text-slate-600">Logo ini otomatis jadi ikon header utama dan kop invoice.</p>
                        <input type="file" id="admin-logo-upload" accept="image/*" class="w-full text-xs">
                        <button onclick="saveAdminLogo(event)" class="w-full bg-blue-600 text-white font-bold py-2 rounded">Simpan & Ubah Logo</button>
                    </div>

                    <div>
                        <h3 class="font-bold text-xs text-slate-700 mb-2">Daftar PO Masuk (${appState.orders.length})</h3>
                        <div class="space-y-3">${ordersHtml || '<p class="text-xs text-slate-400">Belum ada PO.</p>'}</div>
                    </div>
                </div>
            `;
        }

        // Simpan Logo Kustom Admin ke LocalStorage
        function saveAdminLogo(e) {
            const fileInput = document.getElementById('admin-logo-upload').files[0];
            if (!fileInput) {
                alert('Pilih file gambar logo terlebih dahulu!');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                appState.settings.appLogo = e.target.result;
                localStorage.setItem('ilham_settings', JSON.stringify(appState.settings));
                updateAppLogoUI();
                alert('Logo utama aplikasi berhasil diubah!');
                loadCatalogView();
            };
            reader.readAsDataURL(fileInput);
        }

        function updateOrderStatus(id, val) {
            const o = appState.orders.find(item => item.id === id);
            if (o) { o.status = val; localStorage.setItem('ilham_orders', JSON.stringify(appState.orders)); }
        }

        function updateOrderResi(id, val) {
            const o = appState.orders.find(item => item.id === id);
            if (o) { o.resi = val; localStorage.setItem('ilham_orders', JSON.stringify(appState.orders)); }
        }

        function markAsPaid(id) {
            const o = appState.orders.find(item => item.id === id);
            if (o) {
                o.paid = true;
                o.status = 'Selesai / Lunas';
                localStorage.setItem('ilham_orders', JSON.stringify(appState.orders));
                loadAdminDashboard();
            }
        }

        function openMyOrders() {
            const container = document.getElementById('main-content');
            const myOrders = appState.orders.filter(o => o.customer.phone === appState.customer?.phone);
            let html = `<div class="space-y-4"><div class="flex justify-between items-center"><button onclick="loadCatalogView()" class="text-xs text-blue-600 font-semibold"><i class="fa-solid fa-arrow-left"></i> Katalog</button><h2 class="font-bold text-sm">Riwayat & Tracking PO Saya</h2></div>`;
            if (myOrders.length === 0) { html += `<p class="text-xs text-slate-400 text-center py-12">Belum ada riwayat PO.</p>`; }
            else {
                myOrders.forEach(o => {
                    html += `
                        <div class="bg-white border rounded-xl p-3 text-xs space-y-2 shadow-sm">
                            <div class="flex justify-between font-bold text-blue-600">
                                <span>${o.id}</span>
                                <span class="px-2 py-0.5 rounded ${o.paid ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}">${o.status}</span>
                            </div>
                            <div class="flex space-x-3 items-center">
                                <img src="${o.mockupImg}" class="w-12 h-12 object-cover rounded border">
                                <div>
                                    <p class="font-semibold">${o.product} (${o.qty} pcs)</p>
                                    <p class="text-slate-500">Total: Rp ${o.totalPrice.toLocaleString('id-ID')}</p>
                                    <p class="text-slate-500">Resi Kurir: <strong class="text-slate-800">${o.resi}</strong></p>
                                </div>
                            </div>
                        </div>`;
                });
            }
            container.innerHTML = html + `</div>`;
        }

        function openAIChatModal() {
            alert("Siti (AI Assistant): Halo! Ada yang ingin ditanyakan seputar produk ILHAM SPUNBOND?");
        }
    </script>
</body>
</html>
