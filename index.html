<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ILHAM APLIKASI MASTER - ILHAM SPUNBOND</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- PWA Link -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="theme-color" content="#2563eb">
    <style>body { font-family: 'Poppins', sans-serif; }</style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased flex justify-center items-center min-h-screen">

    <div class="max-w-md w-full bg-white shadow-2xl relative flex flex-col justify-between min-h-screen">
        
        <!-- HEADER -->
        <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md sticky top-0 z-50">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center overflow-hidden shadow border border-blue-400">
                    <img id="header-custom-logo" src="" alt="Logo" class="w-full h-full object-contain p-1 hidden">
                    <i id="header-default-icon" class="fa-solid fa-bag-shopping text-blue-600 text-lg"></i>
                </div>
                <div>
                    <h1 id="brand-title" class="font-bold text-sm leading-tight">ILHAM SPUNBOND</h1>
                    <p class="text-[10px] text-blue-100">ILHAM APLIKASI MASTER</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openAdminLogin()" class="bg-blue-700 hover:bg-blue-800 px-3 py-1.5 rounded-lg text-xs font-semibold">
                    <i class="fa-solid fa-gear mr-1"></i> Admin Panel
                </button>
            </div>
        </header>

        <!-- KONTEN UTAMA -->
        <main class="p-4 flex-1 space-y-4 overflow-y-auto">
            <div class="bg-blue-50 border border-blue-200 p-4 rounded-2xl text-center space-y-2">
                <h2 class="font-bold text-blue-900 text-sm">Selamat Datang di ILHAM SPUNBOND</h2>
                <p class="text-xs text-slate-600">Aplikasi Master & Kustom Tas Spunbond (Siap PWA / APK).</p>
            </div>

            <!-- PANEL PEMBERITAHUAN STATUS -->
            <div id="status-notif" class="hidden p-3 rounded-xl text-xs font-semibold text-center"></div>

            <div class="bg-white border rounded-2xl p-4 shadow-sm space-y-3">
                <h3 class="font-bold text-xs text-slate-700 uppercase">Aksi Cepat:</h3>
                <button onclick="openAdminLogin()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 rounded-xl text-xs shadow">
                    Masuk Panel Admin (Ganti Logo & Kelola Sistem)
                </button>
            </div>
        </main>

        <!-- FOOTER -->
        <footer class="p-3 text-center text-[10px] text-slate-400 border-t">
            &copy; 2026 ILHAM SPUNBOND - Rajeg, Tangerang
        </footer>
    </div>

    <!-- MODAL ADMIN LOGIN -->
    <div id="modal-admin-login" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl w-full max-w-xs p-5 shadow-2xl space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-xs text-slate-800"><i class="fa-solid fa-lock mr-1 text-blue-600"></i>Panel Admin</h3>
                <button onclick="closeModal('modal-admin-login')" class="text-slate-400 font-bold text-sm">✕</button>
            </div>
            <form onsubmit="verifyAdmin(event)" class="space-y-3 text-xs">
                <input type="password" id="admin-pass-input" placeholder="Kata Sandi Admin" required class="w-full px-3 py-2.5 border rounded-lg outline-none">
                <button type="submit" class="w-full bg-blue-600 text-white font-semibold py-2.5 rounded-lg shadow">Masuk</button>
            </form>
        </div>
    </div>

    <!-- MODAL DASHBOARD ADMIN (UNTUK UPLOAD LOGO) -->
    <div id="modal-admin-dashboard" class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl w-full max-w-sm p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto text-xs">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-slate-800">Dashboard Admin: Pengaturan Logo</h3>
                <button onclick="closeModal('modal-admin-dashboard')" class="text-rose-600 font-bold text-sm">Tutup ✕</button>
            </div>

            <div class="bg-blue-50 p-3.5 rounded-xl border border-blue-200 space-y-2">
                <label class="font-bold text-blue-900 block">Upload Logo Utama Aplikasi:</label>
                <p class="text-[10px] text-slate-600">Pilih gambar logo format PNG (disarankan transparan).</p>
                <input type="file" id="admin-logo-file" accept="image/*" class="w-full text-[10px] bg-white p-1.5 border rounded">
                <button onclick="saveAdminLogoFix()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg shadow">
                    Simpan Logo Secara Permanen
                </button>
            </div>

            <div id="admin-success-msg" class="text-center font-bold text-green-600 hidden"></div>
        </div>
    </div>

    <script>
        const DEFAULT_ADMIN_PASS = "ilhamadmin123";

        window.onload = function() {
            // Load Service Worker untuk PWA
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
            }
            // Load Logo yang tersimpan
            loadSavedLogo();
        };

        function loadSavedLogo() {
            const savedLogo = localStorage.getItem('ilham_master_logo');
            if (savedLogo) {
                const headerLogo = document.getElementById('header-custom-logo');
                const headerIcon = document.getElementById('header-default-icon');
                headerLogo.src = savedLogo;
                headerLogo.classList.remove('hidden');
                headerIcon.classList.add('hidden');
            }
        }

        function openAdminLogin() {
            document.getElementById('modal-admin-login').classList.remove('hidden');
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function verifyAdmin(e) {
            e.preventDefault();
            const pass = document.getElementById('admin-pass-input').value;
            if (pass === DEFAULT_ADMIN_PASS) {
                closeModal('modal-admin-login');
                document.getElementById('admin-pass-input').value = "";
                document.getElementById('modal-admin-dashboard').classList.remove('hidden');
            } else {
                alert('Kata sandi admin salah!');
            }
        }

        // Fungsionalitas Simpan Logo Tanpa Hang (Dioptimalkan)
        function saveAdminLogoFix() {
            const fileInput = document.getElementById('admin-logo-file').files[0];
            const msgBox = document.getElementById('admin-success-msg');

            if (!fileInput) {
                alert('Pilih file gambar logo terlebih dahulu!');
                return;
            }

            // Kompresi atau konversi gambar agar tidak melebihi kapasitas LocalStorage
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 300; // Ukuran optimal untuk logo header
                    let width = img.width;
                    let height = img.height;
                    if (width > height) {
                        if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                    } else {
                        if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const compressedDataUrl = canvas.toDataURL('image/png');

                    try {
                        localStorage.setItem('ilham_master_logo', compressedDataUrl);
                        loadSavedLogo();
                        
                        msgBox.innerText = "✓ Logo berhasil disimpan secara permanen!";
                        msgBox.classList.remove('hidden');
                        setTimeout(() => {
                            msgBox.classList.add('hidden');
                            closeModal('modal-admin-dashboard');
                        }, 1500);
                    } catch (err) {
                        alert("Gagal menyimpan: Ukuran file terlalu besar atau memori penuh.");
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(fileInput);
        }
    </script>
</body>
</html>
