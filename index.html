<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ILHAM SPUNBOND</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-slate-100 text-slate-800 antialiased flex justify-center items-center min-h-screen">

    <div class="max-w-md w-full bg-min-h-screen bg-white shadow-2xl relative flex flex-col justify-between min-h-screen">
        
        <!-- HEADER DENGAN LOGO KUSTOM ADMIN -->
        <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center overflow-hidden shadow border border-blue-400">
                    <!-- Logo transparan dari Admin -->
                    <img id="app-logo-view" src="" alt="Logo" class="w-full h-full object-contain p-1 hidden">
                    <i id="default-logo-icon" class="fa-solid fa-bag-shopping text-blue-600 text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base leading-tight">ILHAM SPUNBOND</h1>
                    <p class="text-[10px] text-blue-100">Custom Tas & Merchandise</p>
                </div>
            </div>
            <button onclick="openAdmin()" class="bg-blue-700 hover:bg-blue-800 px-3 py-1 rounded text-xs font-medium">
                Admin
            </button>
        </header>

        <!-- KONTEN UTAMA SEDERHANA -->
        <main class="p-4 flex-1 space-y-4">
            <div class="bg-blue-50 border border-blue-200 rounded-xl p-4 text-center space-y-2">
                <h2 class="font-bold text-blue-800 text-sm">Selamat Datang di ILHAM SPUNBOND</h2>
                <p class="text-xs text-slate-600">Aplikasi kustom tas spunbond siap dibungkus jadi TWA / PWA.</p>
            </div>

            <div class="space-y-2">
                <label class="block text-xs font-semibold text-slate-700">Nama Pemesan</label>
                <input type="text" id="name" placeholder="Masukkan nama Anda" class="w-full px-3 py-2 border rounded-lg text-xs outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <button onclick="pesanWa()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 rounded-lg text-xs transition shadow flex items-center justify-center">
                <i class="fa-brands fa-whatsapp text-sm mr-2"></i> Hubungi Admin via WhatsApp
            </button>
        </main>

        <!-- FOOTER -->
        <footer class="p-3 text-center text-[10px] text-slate-400 border-t">
            &copy; 2026 ILHAM SPUNBOND - Rajeg, Tangerang
        </footer>
    </div>

    <!-- MODAL ADMIN SEDERHANA UNTUK UPLOAD LOGO TRANSPARAN -->
    <div id="admin-modal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl w-full max-w-xs p-5 space-y-3 shadow-xl">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-xs text-slate-800">Panel Admin: Ganti Logo Transparan</h3>
                <button onclick="closeAdmin()" class="text-slate-400 font-bold">✕</button>
            </div>
            <p class="text-[11px] text-slate-500">Upload logo format PNG transparan agar tampil rapi di aplikasi.</p>
            <input type="file" id="logo-file" accept="image/png" class="w-full text-xs">
            <button onclick="uploadLogo()" class="w-full bg-blue-600 text-white font-bold py-2 rounded text-xs">Simpan Logo</button>
        </div>
    </div>

    <script>
        // Load logo tersimpan saat aplikasi dibuka
        window.onload = function() {
            const savedLogo = localStorage.getItem('ilham_custom_logo');
            if (savedLogo) {
                const imgView = document.getElementById('app-logo-view');
                const defIcon = document.getElementById('default-logo-icon');
                imgView.src = savedLogo;
                imgView.classList.remove('hidden');
                defIcon.classList.add('hidden');
            }

            // Daftarkan PWA Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
            }
        };

        function openAdmin() {
            let pass = prompt("Masukkan Kata Sandi Admin:");
            if (pass === "ilhamadmin123") {
                document.getElementById('admin-modal').classList.remove('hidden');
            } else if (pass !== null) {
                alert("Kata sandi salah!");
            }
        }

        function closeAdmin() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function uploadLogo() {
            const file = document.getElementById('logo-file').files[0];
            if (!file) {
                alert("Pilih file PNG transparan dulu!");
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                localStorage.setItem('ilham_custom_logo', e.target.result);
                alert("Logo berhasil diubah!");
                location.reload();
            };
            reader.readAsDataURL(file);
        }

        function pesanWa() {
            const name = document.getElementById('name').value || "Customer";
            window.open(`https://wa.me/6281234567890?text=Halo%20Admin%20ILHAM%20SPUNBOND,%20saya%20${name}%20ingin%20memesan%20tas.`, '_blank');
        }
    </script>
</body>
</html>
