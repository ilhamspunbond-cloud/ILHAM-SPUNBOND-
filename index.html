<!-- Form Tambah/Edit Item Etalase -->
<div class="border-t pt-6 space-y-4">
    <h4 class="font-bold text-slate-800 text-sm">2. Kelola Etalase Model Tas (Geser Samping)</h4>
    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
        <input type="hidden" id="edit-index" value="-1">
        <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Model Tas</label>
            <input type="text" id="item-name" placeholder="Contoh: Tas Model Oval" class="w-full border border-slate-300 rounded-xl px-3 py-2 text-xs bg-white">
        </div>
        <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Upload Gambar Contoh Produk (Dari Galeri HP/Laptop)</label>
            <!-- Diubah jadi input file supaya langsung ambil dari galeri -->
            <input type="file" id="item-image-file" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100 cursor-pointer bg-white border border-slate-300 rounded-xl p-1" onchange="previewImageAdmin(event)">
            <!-- Menyimpan data string gambar sementara -->
            <input type="hidden" id="item-image-base64">
        </div>
        <!-- Preview gambar kecil saat di-upload admin -->
        <div id="admin-img-preview-container" class="hidden">
            <span class="block text-[10px] text-slate-500 mb-1">Preview Gambar:</span>
            <img id="admin-img-preview" src="" class="w-16 h-16 object-cover rounded-xl border">
        </div>
        <div class="flex space-x-2 pt-1">
            <button onclick="simpanItemEtalase()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 text-xs font-bold px-4 py-2.5 rounded-xl shadow">Simpan / Tambah Model</button>
            <button onclick="resetFormItem()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold px-4 py-2.5 rounded-xl">Reset</button>
        </div>
    </div>

    <h5 class="font-bold text-xs text-slate-500 uppercase tracking-wider pt-2">Daftar Model Tas Aktif:</h5>
    <div id="admin-product-list" class="space-y-2 max-h-48 overflow-y-auto pr-2"></div>
</div>
